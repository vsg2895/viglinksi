<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Viglinksi tab mark: the gold audit seal from src/components/Logo.tsx — a ring
    with a check inside, on the site's dark ground. This file previously held a
    byte-identical copy of roulettingo's roulette wheel, so the tab showed a
    sibling brand. Strokes are deliberately heavy: at 16px a hairline ring
    disappears entirely.
  -->
  <rect width="32" height="32" rx="8" fill="#1e1729"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#e6c37e" stroke-width="2.4"/>
  <path d="M10.8 16.4l3.4 3.4 7-7.6" fill="none" stroke="#e6c37e" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
